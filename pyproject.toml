[project]
name = "yuna-engine"
version = "0.1.0"
description = "A fast, dependency-light ECS game engine for Python."
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Eduardo A. Garcia", email = "eduardo@helloyuna.ai" }]
keywords = ["game-engine", "ecs", "gamedev", "entity-component-system"]
dependencies = [
    "lz4",
    "PyYAML",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Games/Entertainment",
    "Topic :: Software Development :: Libraries",
]

[project.urls]
Repository = "https://github.com/eduardoagarcia/yuna"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/yuna"]

[dependency-groups]
dev = [
    "pytest>=8.4",
    "pytest-asyncio>=1.1",
    "pytest-cov>=6.3",
    "faker>=37.6",
    "msgpack>=1.1",
    "ruff>=0.12",
    "mypy>=2.3",
    "isort>=6.0",
    "pre-commit>=4.3",
    "types-PyYAML",
]

[tool.pytest.ini_options]
addopts = "-v -W ignore::DeprecationWarning -W ignore::UserWarning"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.report]
fail_under = 100
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "^\\s*\\.\\.\\.$",
]

[tool.coverage.run]
omit = [
    "*/tests/*",
    "*/test_*.py",
]

[tool.ruff]
line-length = 88
target-version = "py314"
preview = true
exclude = [".git", "__pycache__", ".venv", "venv", "build", "dist"]

[tool.ruff.lint]
select = ["E", "W", "F", "B", "C4", "UP", "PLC", "PLR", "A"]
ignore = [
    "I",
    "PLR0913",
    "PLR0912",
    "PLR0915",
    "PLR0904",
    "PLR0911",
    "PLR6301",
]

[tool.ruff.lint.pylint]
allow-magic-value-types = ["int", "str", "bytes"]
max-args = 10

[tool.ruff.lint.per-file-ignores]
# Tests intentionally assert `== ""`, use plain fixture classes, explicit
# arithmetic, and list membership — relax those preview-rule nits here.
"tests/**/*.py" = [
    "PLR2004",
    "PLR6301",
    "A",
    "PLC1901",
    "B903",
    "PLR6104",
    "PLR6201",
]

[tool.isort]
profile = "black"
line_length = 88
known_first_party = ["yuna"]

[tool.mypy]
python_version = "3.14"
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
warn_unreachable = true
check_untyped_defs = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["lz4.*", "engine_native", "msgpack.*"]
ignore_missing_imports = true
